<!DOCTYPE HTML>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale="1.0">
    <title>Cadastro - Clone Netflix</title>
    <!-- Likando o novo CSS específico para esta página -->
    <link rel="stylesheet" href="../styles/cadastro.css">
</head>
<body>
    <!-- Cabeçalho simples -->
	<header class="header">
		<a href="../index.html" class="logo">NETFLIX</a>
	</header>
	
	<!-- Caixa central de cadastro -->
	<main class="cadastro-container">
		<h2>Informe seus dados para entrar </h2>
		
		<!-- Formulário -->
		<form id="form-cadastro">

			<div class="input-group">
				<input type="email" id="e-mail" placeholder="Email" required>
			</div>
			
			<div class="input-group">
				<input type="password" id="password" placeholder="Senha" required>
			</div>
			
			<button type="submit" class="btn-cadastrar">Entrar</button>
			
			<p class="login-link">Ou <a href="./cadastro.html">Crie uma conta</a></p>
		</form>
	</main>
	
	<!-- Usando o mesmo arquivo JS da página inicial -->
	<script src="../js/scriptLogin.js"></script>
</body>
</html>
